services:
  minecraft:
    image: itzg/minecraft-server:java17
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.20.4"
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "12"
      MEMORY: "1G"
    volumes:
      - ./data:/data
    restart: always
